# .github/workflows/update_readme_feed.yml
name: Update README with Latest Blog Post

on:
  schedule:
    # Runs every 12 hours to check for new blog posts.
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows manual run from the Actions tab.

# START: --- ADD THIS BLOCK ---
# This gives the workflow the necessary permissions to write to the repository.
permissions:
  contents: write
# END: --- ADD THIS BLOCK ---

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install feedparser

      - name: Run Python script to update README
        run: python ./scripts/update_readme.py

      - name: Commit and push if there are changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          if git diff-index --quiet HEAD; then
            echo "No changes to commit."
          else
            git commit -m "chore: Update latest Android blog post"
            git push
          fi