<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-labelledby="title desc">
  <title id="title">JAMIE10X OS GitHub profile banner</title>
  <desc id="desc">A clean cyber terminal developer OS banner for JAMIE10X OS with Android, Kotlin, Compose, Flutter, APIs, and backend systems branding.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="0.58" stop-color="#0A1118"/>
      <stop offset="1" stop-color="#0E1420"/>
    </linearGradient>

    <linearGradient id="top-accent" x1="220" y1="0" x2="1380" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3DDC84" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#3DDC84" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#3DDC84" stop-opacity="0.92"/>
      <stop offset="0.82" stop-color="#7C4DFF" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#7C4DFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="center-line" x1="270" y1="0" x2="1330" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3DDC84" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3DDC84" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3DDC84" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 H 0 V 44" fill="none" stroke="#263241" stroke-width="0.55" opacity="0.34"/>
    </pattern>

    <pattern id="scanlines" width="1" height="8" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#FFFFFF" opacity="0.035"/>
    </pattern>

    <filter id="title-glow" x="-10%" y="-35%" width="120%" height="170%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="
        0 0 0 0 0.239
        0 0 0 0 0.863
        0 0 0 0 0.518
        0 0 0 0.58 0" result="greenBlur"/>
      <feMerge>
        <feMergeNode in="greenBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="pin-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono {
        font-family: "SFMono-Regular", "Cascadia Code", "Liberation Mono", "Courier New", monospace;
      }

      .ui {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
    </style>
  </defs>

  <rect width="1600" height="400" rx="18" fill="url(#background)"/>
  <rect width="1600" height="400" rx="18" fill="url(#grid)"/>
  <rect width="1600" height="400" rx="18" fill="url(#scanlines)"/>

  <path d="M 245 54 H 1355" stroke="url(#top-accent)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 300 201 H 1300" stroke="url(#center-line)" stroke-width="1.2" stroke-linecap="round"/>

  <rect x="42" y="34" width="1516" height="332" rx="12" fill="none" stroke="#1C2A35" stroke-width="1.2"/>
  <rect x="64" y="56" width="1472" height="288" rx="7" fill="none" stroke="#273543" stroke-width="0.9" opacity="0.82"/>

  <path d="M 84 118 V 74 H 128" fill="none" stroke="#3DDC84" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1516 118 V 74 H 1472" fill="none" stroke="#3DDC84" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 84 282 V 326 H 128" fill="none" stroke="#3DDC84" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1516 282 V 326 H 1472" fill="none" stroke="#3DDC84" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M 104 94 H 188" stroke="#3DDC84" stroke-width="1" opacity="0.35"/>
  <path d="M 1496 94 H 1412" stroke="#3DDC84" stroke-width="1" opacity="0.35"/>
  <path d="M 104 306 H 188" stroke="#3DDC84" stroke-width="1" opacity="0.28"/>
  <path d="M 1496 306 H 1412" stroke="#3DDC84" stroke-width="1" opacity="0.28"/>

  <text x="104" y="86" class="mono" fill="#A8B3BE" font-size="22" font-weight="600" letter-spacing="1.4">
    JAMIE10X.OS // BUILD: STABLE
  </text>

  <g transform="translate(1364 70)">
    <circle cx="0" cy="0" r="7" fill="#3DDC84" filter="url(#pin-glow)"/>
    <text x="18" y="7" class="mono" fill="#3DDC84" font-size="22" font-weight="700" letter-spacing="1.2">ONLINE</text>
  </g>

  <g opacity="0.6">
    <circle cx="180" cy="200" r="50" fill="none" stroke="#3DDC84" stroke-width="1.4" stroke-dasharray="8 10"/>
    <circle cx="180" cy="200" r="31" fill="none" stroke="#3DDC84" stroke-width="1.3" opacity="0.6"/>
    <circle cx="180" cy="200" r="6" fill="#3DDC84" filter="url(#pin-glow)" opacity="0.72"/>
    <path d="M 180 134 V 116" stroke="#3DDC84" stroke-width="1.2" opacity="0.44"/>
    <path d="M 114 200 H 94" stroke="#3DDC84" stroke-width="1.2" opacity="0.44"/>
    <path d="M 230 200 H 310" stroke="#3DDC84" stroke-width="1" stroke-dasharray="7 9" opacity="0.24"/>
  </g>

  <g opacity="0.54">
    <circle cx="1420" cy="200" r="50" fill="none" stroke="#7C4DFF" stroke-width="1.4" stroke-dasharray="8 10"/>
    <circle cx="1420" cy="200" r="31" fill="none" stroke="#58A6FF" stroke-width="1.3" opacity="0.55"/>
    <circle cx="1420" cy="200" r="6" fill="#58A6FF" filter="url(#pin-glow)" opacity="0.72"/>
    <path d="M 1420 134 V 116" stroke="#58A6FF" stroke-width="1.2" opacity="0.35"/>
    <path d="M 1486 200 H 1506" stroke="#58A6FF" stroke-width="1.2" opacity="0.35"/>
    <path d="M 1370 200 H 1290" stroke="#58A6FF" stroke-width="1" stroke-dasharray="7 9" opacity="0.22"/>
  </g>

  <text x="800" y="166" class="ui" text-anchor="middle" fill="#F3F8F5" font-size="78" font-weight="800" letter-spacing="8" filter="url(#title-glow)">
    JAMIE10X OS
  </text>
  <text x="800" y="166" class="ui" text-anchor="middle" fill="none" stroke="#3DDC84" stroke-width="1.25" stroke-opacity="0.72" font-size="78" font-weight="800" letter-spacing="8">
    JAMIE10X OS
  </text>

  <text x="800" y="216" class="ui" text-anchor="middle" fill="#D5DEE7" font-size="25" font-weight="500" letter-spacing="0.5">
    Android-first Software Engineer · Kotlin · Compose · Flutter · APIs
  </text>

  <g class="ui" font-size="19" font-weight="700" text-anchor="middle">
    <g transform="translate(507 251)">
      <rect x="-55" y="-20" width="110" height="40" rx="20" fill="#10261C" stroke="#3DDC84" stroke-width="1.4"/>
      <text y="7" fill="#BDF8D7">Kotlin</text>
    </g>

    <g transform="translate(671 251)">
      <rect x="-91" y="-20" width="182" height="40" rx="20" fill="#10261C" stroke="#3DDC84" stroke-width="1.4"/>
      <text y="7" fill="#BDF8D7">Jetpack Compose</text>
    </g>

    <g transform="translate(858 251)">
      <rect x="-58" y="-20" width="116" height="40" rx="20" fill="#101E2C" stroke="#58A6FF" stroke-width="1.4"/>
      <text y="7" fill="#C7E2FF">Flutter</text>
    </g>

    <g transform="translate(1047 251)">
      <rect x="-99" y="-20" width="198" height="40" rx="20" fill="#17172A" stroke="#9B7CFF" stroke-width="1.4"/>
      <text y="7" fill="#E0D6FF">TypeScript / Go</text>
    </g>
  </g>

  <path d="M 176 306 H 1424" stroke="#22303D" stroke-width="1"/>
  <text x="800" y="334" class="mono" text-anchor="middle" fill="#A7B2BD" font-size="20" font-weight="500" letter-spacing="1.1">
    UTC+5 · Native Android · Cross-Platform · Backend Systems · Open to Collaboration
  </text>
</svg>
