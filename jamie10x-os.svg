<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1a2332" stroke-width="0.4"/>
    </pattern>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="centerGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3DDC84;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#3DDC84;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#3DDC84;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4285F4;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#4285F4;stop-opacity:0.8"/>
      <stop offset="70%" style="stop-color:#3DDC84;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#3DDC84;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0F14"/>
      <stop offset="100%" style="stop-color:#0d1520"/>
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="900" height="230" fill="url(#bgGrad)" rx="6"/>
  <rect width="900" height="230" fill="url(#grid)" rx="6"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="900" height="2" fill="url(#topBar)" rx="1"/>

  <!-- Corner brackets — top left -->
  <polyline points="18,50 18,18 50,18" fill="none" stroke="#3DDC84" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Corner brackets — top right -->
  <polyline points="850,18 882,18 882,50" fill="none" stroke="#3DDC84" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Corner brackets — bottom left -->
  <polyline points="18,180 18,212 50,212" fill="none" stroke="#3DDC84" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Corner brackets — bottom right -->
  <polyline points="850,212 882,212 882,180" fill="none" stroke="#3DDC84" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Top status bar text -->
  <text x="32" y="34" fill="#8B949E" font-family="'Courier New',Courier,monospace" font-size="9.5" letter-spacing="1">JAMIE10X.OS  v2.0.0  |  BUILD::STABLE</text>
  <circle cx="848" cy="29" r="4" fill="#3DDC84" filter="url(#softglow)"/>
  <text x="858" y="33" fill="#3DDC84" font-family="'Courier New',Courier,monospace" font-size="9.5" letter-spacing="0.5">ONLINE</text>

  <!-- Left decorative circuit node -->
  <circle cx="75" cy="115" r="22" fill="none" stroke="#3DDC84" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <circle cx="75" cy="115" r="13" fill="none" stroke="#3DDC84" stroke-width="1" opacity="0.6"/>
  <circle cx="75" cy="115" r="4" fill="#3DDC84" opacity="0.7" filter="url(#softglow)"/>
  <line x1="75" y1="93" x2="75" y2="86" stroke="#3DDC84" stroke-width="1.2" opacity="0.5"/>
  <line x1="53" y1="115" x2="46" y2="115" stroke="#3DDC84" stroke-width="1.2" opacity="0.5"/>
  <line x1="97" y1="115" x2="120" y2="115" stroke="#3DDC84" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>

  <!-- Right decorative circuit node -->
  <circle cx="825" cy="115" r="22" fill="none" stroke="#4285F4" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <circle cx="825" cy="115" r="13" fill="none" stroke="#4285F4" stroke-width="1" opacity="0.6"/>
  <circle cx="825" cy="115" r="4" fill="#4285F4" opacity="0.7" filter="url(#softglow)"/>
  <line x1="780" y1="115" x2="803" y2="115" stroke="#4285F4" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>

  <!-- Central glow line -->
  <rect x="0" y="114" width="900" height="1" fill="url(#centerGlow)"/>

  <!-- Main title "JAMIE10X OS" -->
  <text x="450" y="100"
        fill="#3DDC84"
        font-family="'Courier New',Courier,monospace"
        font-size="54"
        font-weight="bold"
        text-anchor="middle"
        letter-spacing="8"
        filter="url(#glow)">JAMIE10X OS</text>

  <!-- Subtitle -->
  <text x="450" y="135"
        fill="#E6EDF3"
        font-family="'Courier New',Courier,monospace"
        font-size="12.5"
        text-anchor="middle"
        letter-spacing="2.5"
        opacity="0.85">Android-first developer  ·  Clean Architecture  ·  Kotlin</text>

  <!-- Status pills -->
  <rect x="222" y="155" width="108" height="22" rx="11" fill="#0d1a2a" stroke="#3DDC84" stroke-width="1"/>
  <text x="276" y="170" fill="#3DDC84" font-family="'Courier New',Courier,monospace" font-size="10.5" text-anchor="middle" letter-spacing="0.5">Kotlin · Compose</text>

  <rect x="346" y="155" width="90" height="22" rx="11" fill="#0d1a2a" stroke="#4285F4" stroke-width="1"/>
  <text x="391" y="170" fill="#4285F4" font-family="'Courier New',Courier,monospace" font-size="10.5" text-anchor="middle" letter-spacing="0.5">Flutter · Dart</text>

  <rect x="452" y="155" width="90" height="22" rx="11" fill="#0d1a2a" stroke="#7F52FF" stroke-width="1"/>
  <text x="497" y="170" fill="#a78bfa" font-family="'Courier New',Courier,monospace" font-size="10.5" text-anchor="middle" letter-spacing="0.5">TypeScript · Go</text>

  <rect x="558" y="155" width="120" height="22" rx="11" fill="#0d1a2a" stroke="#8B949E" stroke-width="1"/>
  <text x="618" y="170" fill="#8B949E" font-family="'Courier New',Courier,monospace" font-size="10.5" text-anchor="middle" letter-spacing="0.5">Clean Architecture</text>

  <!-- Bottom separator -->
  <rect x="30" y="195" width="840" height="0.6" fill="#1E2D3D"/>

  <!-- Bottom info bar -->
  <text x="450" y="216"
        fill="#8B949E"
        font-family="'Courier New',Courier,monospace"
        font-size="9.5"
        text-anchor="middle"
        letter-spacing="1">UTC+5  ·  Native Android  ·  Cross-Platform  ·  Backend  ·  Open to Collaboration</text>
</svg>