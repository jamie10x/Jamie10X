<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1a2332" stroke-width="0.3"/>
    </pattern>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="centerGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3DDC84;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#3DDC84;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#3DDC84;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4285F4;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#4285F4;stop-opacity:0.8"/>
      <stop offset="70%" style="stop-color:#3DDC84;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#3DDC84;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0F14"/>
      <stop offset="100%" style="stop-color:#0d1520"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="250" fill="url(#bgGrad)" rx="6"/>
  <rect width="900" height="250" fill="url(#grid)" rx="6"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="900" height="2" fill="url(#topBar)" rx="1"/>

  <!-- Corner brackets — top left -->
  <polyline points="20,50 20,20 50,20" fill="none" stroke="#3DDC84" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Corner brackets — top right -->
  <polyline points="850,20 880,20 880,50" fill="none" stroke="#3DDC84" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Corner brackets — bottom left -->
  <polyline points="20,200 20,230 50,230" fill="none" stroke="#3DDC84" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Corner brackets — bottom right -->
  <polyline points="850,230 880,230 880,200" fill="none" stroke="#3DDC84" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Top status bar — left -->
  <text x="34" y="36"
        fill="#8B949E"
        font-family="'Courier New',Courier,monospace"
        font-size="11"
        letter-spacing="0.8">JAMIE10X.OS // BUILD: STABLE</text>

  <!-- Top status bar — right (green dot + ONLINE) -->
  <circle cx="836" cy="31" r="4.5" fill="#3DDC84" filter="url(#softglow)"/>
  <text x="847" y="36"
        fill="#3DDC84"
        font-family="'Courier New',Courier,monospace"
        font-size="11"
        letter-spacing="0.5">ONLINE</text>

  <!-- Left HUD node -->
  <circle cx="72" cy="122" r="20" fill="none" stroke="#3DDC84" stroke-width="1" stroke-dasharray="4,4" opacity="0.35"/>
  <circle cx="72" cy="122" r="12" fill="none" stroke="#3DDC84" stroke-width="1" opacity="0.55"/>
  <circle cx="72" cy="122" r="3.5" fill="#3DDC84" opacity="0.65" filter="url(#softglow)"/>
  <line x1="72" y1="101" x2="72" y2="95" stroke="#3DDC84" stroke-width="1.2" opacity="0.45"/>
  <line x1="51" y1="122" x2="44" y2="122" stroke="#3DDC84" stroke-width="1.2" opacity="0.45"/>
  <line x1="93" y1="122" x2="117" y2="122" stroke="#3DDC84" stroke-width="0.8" opacity="0.25" stroke-dasharray="3,3"/>

  <!-- Right HUD node -->
  <circle cx="828" cy="122" r="20" fill="none" stroke="#4285F4" stroke-width="1" stroke-dasharray="4,4" opacity="0.35"/>
  <circle cx="828" cy="122" r="12" fill="none" stroke="#4285F4" stroke-width="1" opacity="0.55"/>
  <circle cx="828" cy="122" r="3.5" fill="#4285F4" opacity="0.65" filter="url(#softglow)"/>
  <line x1="783" y1="122" x2="807" y2="122" stroke="#4285F4" stroke-width="0.8" opacity="0.25" stroke-dasharray="3,3"/>

  <!-- Central glow line (very subtle) -->
  <rect x="0" y="121" width="900" height="1" fill="url(#centerGlow)"/>

  <!-- Main title "JAMIE10X OS" -->
  <text x="450" y="108"
        fill="#3DDC84"
        font-family="'Courier New',Courier,monospace"
        font-size="52"
        font-weight="bold"
        text-anchor="middle"
        letter-spacing="6"
        filter="url(#glow)">JAMIE10X OS</text>

  <!-- Subtitle -->
  <text x="450" y="140"
        fill="#E6EDF3"
        font-family="'Courier New',Courier,monospace"
        font-size="11"
        text-anchor="middle"
        letter-spacing="1"
        opacity="0.82">Android-first developer  ·  Kotlin  ·  Compose  ·  Flutter  ·  Backend-aware</text>

  <!-- Skill chip: Kotlin — green border, green text -->
  <rect x="217" y="158" width="76" height="22" rx="11" fill="#0d1a2a" stroke="#3DDC84" stroke-width="1"/>
  <text x="255" y="173" fill="#3DDC84" font-family="'Courier New',Courier,monospace" font-size="10.5" text-anchor="middle" letter-spacing="0.3">Kotlin</text>

  <!-- Skill chip: Jetpack Compose — green border, blue text -->
  <rect x="307" y="158" width="136" height="22" rx="11" fill="#0d1a2a" stroke="#3DDC84" stroke-width="1"/>
  <text x="375" y="173" fill="#4285F4" font-family="'Courier New',Courier,monospace" font-size="10.5" text-anchor="middle" letter-spacing="0.3">Jetpack Compose</text>

  <!-- Skill chip: Flutter — blue border, blue text -->
  <rect x="457" y="158" width="76" height="22" rx="11" fill="#0d1a2a" stroke="#4285F4" stroke-width="1"/>
  <text x="495" y="173" fill="#4285F4" font-family="'Courier New',Courier,monospace" font-size="10.5" text-anchor="middle" letter-spacing="0.3">Flutter</text>

  <!-- Skill chip: TypeScript / Go — purple border, lavender text -->
  <rect x="547" y="158" width="136" height="22" rx="11" fill="#0d1a2a" stroke="#7C4DFF" stroke-width="1"/>
  <text x="615" y="173" fill="#a78bfa" font-family="'Courier New',Courier,monospace" font-size="10.5" text-anchor="middle" letter-spacing="0.3">TypeScript / Go</text>

  <!-- Bottom separator -->
  <rect x="34" y="210" width="832" height="0.5" fill="#1E2D3D"/>

  <!-- Bottom info bar -->
  <text x="450" y="232"
        fill="#8B949E"
        font-family="'Courier New',Courier,monospace"
        font-size="10"
        text-anchor="middle"
        letter-spacing="0.8">UTC+5  ·  Native Android  ·  Cross-Platform  ·  Backend  ·  Open to Collaboration</text>
</svg>
